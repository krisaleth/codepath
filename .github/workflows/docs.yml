name: Docs

on:
  push:
    branches: [main]
    paths:
      - "docs/**"
      - "tools/**"
      - "README.md"
      - ".markdownlint-cli2.jsonc"
      - ".github/workflows/docs.yml"
  pull_request:
    paths:
      - "docs/**"
      - "tools/**"
      - "README.md"
      - ".markdownlint-cli2.jsonc"
      - ".github/workflows/docs.yml"

permissions:
  contents: read

concurrency:
  group: docs-${{ github.ref }}
  cancel-in-progress: true

jobs:
  traceability:
    name: Truy vết và backlog
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python tools/check_docs.py --strict
      - run: python tools/generate_backlog.py --check

  lint:
    name: Markdown lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: npx --yes markdownlint-cli2@0.22.0

  mermaid:
    name: Sơ đồ Mermaid
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: npm install -g @mermaid-js/mermaid-cli@11.12.0
      - run: python tools/check_mermaid.py
